{% extends "base.html" %}
{% block title %}Searching {{ question }} {% endblock title %}
{% block body %}
        <div id="content">
            <h1>Results for {{ question }}</h1>
            <ul id="results">
                {% for post in posts %}
                <li>{{ post["_source"]["id"] }}</li>
                {% endfor  %}
            </ul>
        </div>
{% endblock body %}
